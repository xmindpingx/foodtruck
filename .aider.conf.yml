# ── Models ──────────────────────────────────────────────────────────────────────────────
# ── Models ──────────────────────────────────────────────────────────────────────────────
architect: false
model: ollama_chat/huihui_ai/huihui-4:8b  
edit-format: whole   
# Repo Map & Context Limits
map-tokens: 1024                             # Reduce repo map token budget to conserve context
map-refresh: manual                          # Stop automatic background map refreshing to prevent token churn
max-chat-history-tokens: 8192                # Cap chat history to avoid context overflow and repetition loops




auto-accept-architect: true

# ── Git ─────────────────────────────────────────────────────────────────────────────────
auto-commits: false          
dirty-commits: false         
attribute-author: false      
attribute-committer: false  
commit-prompt: "feat: {message}\n\n[aider]"

# ── Repo map ─────────────────────────────────────────────────────────────────────────────   
map-multiplier-no-files: 2  


# ── Terminal / UX ────────────────────────────────────────────────────────────────────────
stream: true                   
dark-mode: true                
pretty: true                   
no-show-model-warnings: true   
suggest-shell-commands: true  
watch-files: true   
notifications: true 

# ── Session continuity & Misc ─────────────────────────────────────────────────────────────
restore-chat-history: true     
max-chat-history-tokens: 13288  
show-diffs: false               
analytics-disable: true    
check-update: false
